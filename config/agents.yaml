# Rôles des agents et modèle par défaut.
# Priorité : label model:* du ticket > variante de run > rôle.
# Toujours un alias (opus, sonnet, haiku), jamais un identifiant de version.

pool:
  max_agents: 5          # slots globaux, tous tickets et tous repos confondus
  release_on_review: true  # un agent qui attend une validation libère son slot

roles:
  po:
    model: opus
    label: agent:po
    from_status: status:draft
    to_status: status:dor-review
    skills: [mro-grill-with-docs]
  archi:
    model: opus
    label: agent:archi
    from_status: status:ready
    to_status: status:plan-review
  dev:
    model: sonnet
    label: agent:dev
    from_status: status:dev
    to_status: status:qa
    worktree_per_repo: true
  qa:
    model: sonnet
    label: agent:qa
    from_status: status:qa
    to_status: status:arbitrage
  arbitre:
    model: haiku
    label: agent:arbitre
    from_status: status:arbitrage
    to_status: [status:done, status:pr-review]   # selon merge:auto / merge:human
  retro:
    model: sonnet
    label: agent:retro
    trigger: run_close

blocked_after_failures: 3

projects:
  # Repos que l'orchestrateur pilote pour le projet test.
  - repo: memento
    baseline_tag: baseline-v0
  - repo: kosmos
    baseline_tag: baseline-v0
