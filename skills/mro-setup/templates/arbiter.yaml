# Grille de l'arbitre (lue par skills/mro-arbitrate-pr/scripts/grid.py).
# Auto-merge seulement si tous les critères sont au vert.

max_diff_lines: 150            # lignes ajoutées + supprimées, hors tests

test_globs:
  - "tests/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/*.test.*"
  - "**/*.spec.*"

code_globs:
  - "**/*.py"
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.js"

# Zones sensibles : toute modification part en revue humaine.
sensitive_globs:
  - ".github/**"
  - "docs/agents/**"
  - ".claude/**"
  - ".agents/**"
  # propres au repo, à compléter au setup (ex. pour memento) :
  # - "src/memento/ingest/**"
  # - "src/memento/embeddings/**"
  # - "src/memento/index/**"

dependency_files:
  - "pyproject.toml"
  - "uv.lock"
  - "requirements*.txt"
  - "package.json"
  - "package-lock.json"
  - "pnpm-lock.yaml"

auto_merge_risk_labels:
  - "risk:low"

eval_required: false           # true pour un repo dont l'éval doit être mesurée à chaque PR
